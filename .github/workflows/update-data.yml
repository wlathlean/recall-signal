name: Update recall data

on:
  schedule:
    - cron: '0 6,15 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official recall data
        run: python scripts/update_tracker.py
      - name: Commit changed data
        run: |
          git config user.name "recall-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/tracker.json
          git diff --cached --quiet || git commit -m "Update recall data"
          git push
